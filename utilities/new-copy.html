<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Snippet System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#6366f1'
                    }
                }
            }
        }
    </script>
    <style>
        .snippet-preview {
            border: 2px dashed #e5e7eb;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(0, 0, 0, 0.02) 10px,
                rgba(0, 0, 0, 0.02) 20px
            );
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-900">Code Snippet Manager</h1>
                <button onclick="openAddModal()" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">
                    + Add New Snippet
                </button>
            </div>
        </div>
    </header>

    <!-- Filter & Search -->
    <div class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex gap-4 mb-6">
            <input 
                type="text" 
                id="searchInput"
                placeholder="Search snippets..." 
                class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
                onkeyup="filterSnippets()"
            >
            <select id="categoryFilter" onchange="filterSnippets()" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary">
                <option value="">All Categories</option>
                <option value="components">Components</option>
                <option value="layouts">Layouts</option>
                <option value="forms">Forms</option>
                <option value="animations">Animations</option>
                <option value="utilities">Utilities</option>
            </select>
            <select id="typeFilter" onchange="filterSnippets()" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary">
                <option value="">All Types</option>
                <option value="html">HTML/CSS</option>
                <option value="react">React</option>
                <option value="javascript">JavaScript</option>
            </select>
        </div>

        <!-- Snippets Grid -->
        <div id="snippetsContainer" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Snippets will be rendered here -->
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="addModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-xl shadow-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
                <div class="p-6 border-b">
                    <h2 class="text-xl font-semibold" id="modalTitle">Add New Snippet</h2>
                </div>
                <form id="snippetForm" class="p-6 space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Title</label>
                            <input type="text" id="snippetTitle" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Category</label>
                            <select id="snippetCategory" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary">
                                <option value="components">Components</option>
                                <option value="layouts">Layouts</option>
                                <option value="forms">Forms</option>
                                <option value="animations">Animations</option>
                                <option value="utilities">Utilities</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Type</label>
                            <select id="snippetType" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary">
                                <option value="html">HTML/CSS</option>
                                <option value="react">React</option>
                                <option value="javascript">JavaScript</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Tags (comma separated)</label>
                            <input type="text" id="snippetTags" placeholder="button, blue, hover" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                        <textarea id="snippetDescription" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Code</label>
                        <textarea id="snippetCode" rows="10" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary font-mono text-sm" required></textarea>
                    </div>

                    <div class="flex justify-end gap-3 pt-4">
                        <button type="button" onclick="closeAddModal()" class="px-4 py-2 text-gray-600 hover:text-gray-800">Cancel</button>
                        <button type="submit" class="bg-primary text-white px-6 py-2 rounded-lg hover:bg-blue-600">Save Snippet</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-4 right-4 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg hidden z-50">
        Code copied to clipboard!
    </div>

    <script>
        // Sample data
        let snippets = [
            {
                id: 1,
                title: "Gradient Button",
                category: "components",
                type: "html",
                description: "Beautiful gradient button with hover effects",
                tags: ["button", "gradient", "hover"],
                code: `<button class="px-6 py-3 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-lg hover:from-blue-600 hover:to-purple-700 transform hover:scale-105 transition-all duration-200 shadow-lg hover:shadow-xl">
  Click Me
</button>`,
                createdAt: new Date().toISOString()
            },
            {
                id: 2,
                title: "Card Component",
                category: "components",
                type: "html",
                description: "Modern card layout with shadow and hover effects",
                tags: ["card", "layout", "shadow"],
                code: `<div class="max-w-sm bg-white rounded-xl shadow-md hover:shadow-xl transition-shadow duration-300 overflow-hidden">
  <img class="w-full h-48 object-cover" src="https://via.placeholder.com/400x200" alt="Card Image">
  <div class="p-6">
    <h3 class="text-xl font-semibold text-gray-900 mb-2">Card Title</h3>
    <p class="text-gray-600 mb-4">This is a sample card description that explains what this card is about.</p>
    <button class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">
      Read More
    </button>
  </div>
</div>`,
                createdAt: new Date().toISOString()
            },
            {
                id: 3,
                title: "Loading Spinner",
                category: "animations",
                type: "html",
                description: "CSS-only animated loading spinner",
                tags: ["loading", "spinner", "animation"],
                code: `<div class="flex items-center justify-center">
  <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
</div>

<!-- Custom spinner with multiple dots -->
<div class="flex space-x-2 justify-center">
  <div class="w-3 h-3 bg-blue-500 rounded-full animate-bounce"></div>
  <div class="w-3 h-3 bg-blue-500 rounded-full animate-bounce" style="animation-delay: 0.1s;"></div>
  <div class="w-3 h-3 bg-blue-500 rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
</div>`,
                createdAt: new Date().toISOString()
            }
        ];

        let editingId = null;

        // Load snippets from localStorage
        function loadSnippets() {
            const saved = localStorage.getItem('codeSnippets');
            if (saved) {
                snippets = JSON.parse(saved);
            }
            renderSnippets();
        }

        // Save snippets to localStorage
        function saveSnippets() {
            localStorage.setItem('codeSnippets', JSON.stringify(snippets));
        }

        // Render snippets
        function renderSnippets(filteredSnippets = null) {
            const container = document.getElementById('snippetsContainer');
            const snippetsToRender = filteredSnippets || snippets;
            
            if (snippetsToRender.length === 0) {
                container.innerHTML = `
                    <div class="col-span-2 text-center py-12 text-gray-500">
                        <p class="text-xl mb-4">No snippets found</p>
                        <button onclick="openAddModal()" class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                            Add Your First Snippet
                        </button>
                    </div>
                `;
                return;
            }

            container.innerHTML = snippetsToRender.map(snippet => `
                <div class="bg-white rounded-xl shadow-sm border hover:shadow-md transition-shadow duration-200">
                    <!-- Preview Section -->
                    <div class="p-4 border-b bg-gray-50 snippet-preview min-h-[200px] rounded-t-xl">
                        <div class="mb-2 flex justify-between items-center">
                            <span class="text-xs text-gray-500 font-medium">PREVIEW</span>
                            <div class="flex gap-2">
                                <span class="px-2 py-1 text-xs bg-blue-100 text-blue-800 rounded-full">${snippet.category}</span>
                                <span class="px-2 py-1 text-xs bg-green-100 text-green-800 rounded-full">${snippet.type}</span>
                            </div>
                        </div>
                        <div class="preview-content bg-white p-4 rounded-lg border-2 border-dashed border-gray-200 min-h-[140px] flex items-center justify-center">
                            ${snippet.code}
                        </div>
                    </div>

                    <!-- Info Section -->
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-semibold text-gray-900">${snippet.title}</h3>
                            <div class="flex gap-2">
                                <button onclick="editSnippet(${snippet.id})" class="text-gray-400 hover:text-gray-600" title="Edit">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                    </svg>
                                </button>
                                <button onclick="deleteSnippet(${snippet.id})" class="text-red-400 hover:text-red-600" title="Delete">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <p class="text-sm text-gray-600 mb-3">${snippet.description}</p>
                        
                        <div class="flex flex-wrap gap-1 mb-3">
                            ${snippet.tags.map(tag => `<span class="px-2 py-1 text-xs bg-gray-100 text-gray-600 rounded">${tag}</span>`).join('')}
                        </div>

                        <!-- Code Section -->
                        <div class="bg-gray-900 rounded-lg overflow-hidden">
                            <div class="flex justify-between items-center px-4 py-2 bg-gray-800 text-gray-300 text-sm">
                                <span>Code</span>
                                <button onclick="copyCode(${snippet.id})" class="flex items-center gap-1 text-xs hover:text-white transition-colors copy-btn">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                                    </svg>
                                    Copy
                                </button>
                            </div>
                            <pre class="p-4 overflow-x-auto text-sm"><code class="language-html">${escapeHtml(snippet.code)}</code></pre>
                        </div>
                    </div>
                </div>
            `).join('');

            // Highlight syntax
            if (window.Prism) {
                Prism.highlightAll();
            }
        }

        // Filter snippets
        function filterSnippets() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const type = document.getElementById('typeFilter').value;

            const filtered = snippets.filter(snippet => {
                const matchesSearch = snippet.title.toLowerCase().includes(searchTerm) || 
                                    snippet.description.toLowerCase().includes(searchTerm) ||
                                    snippet.tags.some(tag => tag.toLowerCase().includes(searchTerm));
                const matchesCategory = !category || snippet.category === category;
                const matchesType = !type || snippet.type === type;
                
                return matchesSearch && matchesCategory && matchesType;
            });

            renderSnippets(filtered);
        }

        // Copy code to clipboard
        async function copyCode(snippetId) {
            const snippet = snippets.find(s => s.id === snippetId);
            try {
                await navigator.clipboard.writeText(snippet.code);
                showToast('Code copied to clipboard!');
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
        }

        // Show toast notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // Modal functions
        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Add New Snippet';
            document.getElementById('snippetForm').reset();
            document.getElementById('addModal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        function editSnippet(id) {
            editingId = id;
            const snippet = snippets.find(s => s.id === id);
            
            document.getElementById('modalTitle').textContent = 'Edit Snippet';
            document.getElementById('snippetTitle').value = snippet.title;
            document.getElementById('snippetCategory').value = snippet.category;
            document.getElementById('snippetType').value = snippet.type;
            document.getElementById('snippetTags').value = snippet.tags.join(', ');
            document.getElementById('snippetDescription').value = snippet.description;
            document.getElementById('snippetCode').value = snippet.code;
            
            document.getElementById('addModal').classList.remove('hidden');
        }

        function deleteSnippet(id) {
            if (confirm('Are you sure you want to delete this snippet?')) {
                snippets = snippets.filter(s => s.id !== id);
                saveSnippets();
                renderSnippets();
                showToast('Snippet deleted successfully!');
            }
        }

        // Form submission
        document.getElementById('snippetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                title: document.getElementById('snippetTitle').value,
                category: document.getElementById('snippetCategory').value,
                type: document.getElementById('snippetType').value,
                tags: document.getElementById('snippetTags').value.split(',').map(tag => tag.trim()),
                description: document.getElementById('snippetDescription').value,
                code: document.getElementById('snippetCode').value
            };

            if (editingId) {
                // Update existing snippet
                const index = snippets.findIndex(s => s.id === editingId);
                snippets[index] = { ...snippets[index], ...formData };
                showToast('Snippet updated successfully!');
            } else {
                // Add new snippet
                const newSnippet = {
                    id: Date.now(),
                    ...formData,
                    createdAt: new Date().toISOString()
                };
                snippets.unshift(newSnippet);
                showToast('Snippet added successfully!');
            }

            saveSnippets();
            renderSnippets();
            closeAddModal();
        });

        // Utility function
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadSnippets();
        });

        // Export/Import functions
        function exportSnippets() {
            const dataStr = JSON.stringify(snippets, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'code-snippets.json';
            link.click();
        }

        function importSnippets(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const importedSnippets = JSON.parse(e.target.result);
                        snippets = [...snippets, ...importedSnippets];
                        saveSnippets();
                        renderSnippets();
                        showToast('Snippets imported successfully!');
                    } catch (error) {
                        alert('Error importing snippets. Please check the file format.');
                    }
                };
                reader.readAsText(file);
            }
        }
    </script>
</body>
</html>
